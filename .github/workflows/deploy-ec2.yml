name: Check and deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: king-queen-voting-production
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_REGION: ap-southeast-1
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the same Node.js version as EC2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            admin/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix admin ci --no-audit --no-fund

      - name: Install isolated MongoDB test binary
        run: |
          mkdir -p "$RUNNER_TEMP/mongodb"
          curl --fail --silent --show-error --location https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.17.tgz -o "$RUNNER_TEMP/mongodb.tgz"
          echo "fe7bccea2ac1eed16867e9ae5a60481455ee30796f285fe67d0d02a6c2abbdda  $RUNNER_TEMP/mongodb.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mongodb.tgz" --strip-components=1 -C "$RUNNER_TEMP/mongodb"
          echo "MONGOD_BINARY=$RUNNER_TEMP/mongodb/bin/mongod" >> "$GITHUB_ENV"

      - name: Test backend and both frontends without Atlas
        run: |
          npm test
          npm --prefix frontend test
          npm --prefix admin test

      - name: Build voter and admin websites
        run: |
          npm --prefix frontend run build
          npm --prefix admin run build -- --base=/admin/
          python3 deploy/make-release.py --output "$RUNNER_TEMP/voting-release.tar.gz"

      - name: Authenticate to AWS with temporary credentials
        if: vars.KQV_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.KQV_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: voting-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: '052081696303'

      - name: Upload release and deploy through Systems Manager
        if: vars.KQV_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_BUCKET: ${{ vars.KQV_DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ vars.KQV_INSTANCE_ID }}
        run: |
          set -euo pipefail
          RELEASE_HASH=$(sha256sum "$RUNNER_TEMP/voting-release.tar.gz" | cut -d ' ' -f 1)
          aws s3 cp "$RUNNER_TEMP/voting-release.tar.gz" "s3://$DEPLOY_BUCKET/releases/$RELEASE_COMMIT.tar.gz" --only-show-errors
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name KQV-Deploy --document-version '1' --parameters "Commit=$RELEASE_COMMIT,ArtifactSha256=$RELEASE_HASH" --timeout-seconds 120 --query 'Command.CommandId' --output text)
          export COMMAND_ID
          python3 deploy/wait-deployment.py

# Prepared template. Install only after deployment approval and certificate issuance.
# DNS is direct (Cloudflare DNS-only). Do not trust arbitrary CF-Connecting-IP headers.
server {
    listen 80;
    server_name gusto-thadingyut-festival.eddiespace.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://gusto-thadingyut-festival.eddiespace.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name gusto-thadingyut-festival.eddiespace.com;
    ssl_certificate /etc/letsencrypt/live/gusto-thadingyut-festival.eddiespace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gusto-thadingyut-festival.eddiespace.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/king-queen-voting/current/frontend/dist;
    index index.html;
    # Release archives use reproducible timestamps: never validate HTML by mtime/size.
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
    client_max_body_size 55m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Compatible with Google's popup sign-in fallback; do not use same-origin here.
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    add_header Strict-Transport-Security "max-age=86400" always;
    location ^~ /api/v1/health/ { deny all; }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    }
    location = /admin { return 302 /admin/; }
    location /admin/ {
        alias /srv/king-queen-voting/current/admin/dist/;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}

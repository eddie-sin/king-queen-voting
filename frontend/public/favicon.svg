<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Golden line-art clover (♧). The outline is a gold layer with a navy copy on top,
       so only the outer edge of the joined shape stays visible. -->
  <defs>
    <g id="clover">
      <circle cx="32" cy="19" r="10.5"/>
      <circle cx="19" cy="35" r="10.5"/>
      <circle cx="45" cy="35" r="10.5"/>
      <path d="M32 30C32 43 28.5 50 21 55H43C35.5 50 32 43 32 30Z"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="#08152a"/>
  <use href="#clover" fill="#edc77d" stroke="#edc77d" stroke-width="7" stroke-linejoin="round"/>
  <use href="#clover" fill="#08152a"/>
</svg>
